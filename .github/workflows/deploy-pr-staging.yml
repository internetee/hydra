name: 01 PR Deploy to Staging (Kubernetes)

# This workflow is manually triggered to deploy either:
# - a PR merge ref (`deploy_target=pr`, requires `pr_number`), or
# - the latest `develop-eeid` branch commit (`deploy_target=develop-eeid`).
# It builds a Hydra Docker image, pushes it to ECR, and then triggers the IaC
# repository via `repository_dispatch` to deploy the image to shared staging.
# Image tags:
# - PR deploys: `pr-<pr_number>`
# - develop-eeid deploys: explicit version tag, e.g. `v2.2.0.4-eeid`

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - pr
          - develop-eeid
        default: pr
      pr_number:
        description: 'Number of PR to deploy (only digits, e.g., 2889). Required only for PR deploy.'
        required: false
        type: string
      image_tag:
        description: 'Version tag to build and deploy for develop-eeid deploys, e.g., v2.2.0.4-eeid.'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  APP_NAME: hydra
  ECR_URL: 034362061030.dkr.ecr.eu-north-1.amazonaws.com
  AWS_REGION: eu-north-1
  EKS_ASSUME_ROLE_ARN: arn:aws:iam::605134427993:role/terraform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.deploy_target }}" == "pr" ]]; then
            if [[ -z "${{ inputs.pr_number }}" ]]; then
              echo "::error::PR number is required for PR deploy"
              exit 1
            fi
            if ! [[ "${{ inputs.pr_number }}" =~ ^[0-9]+$ ]]; then
              echo "::error::PR number must contain only digits"
              exit 1
            fi
          else
            if [[ -z "${{ inputs.image_tag }}" ]]; then
              echo "::error::image_tag is required for develop-eeid deploy, e.g. v2.2.0.4-eeid"
              exit 1
            fi
            if ! [[ "${{ inputs.image_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-eeid$ ]]; then
              echo "::error::image_tag must look like v2.2.0.4-eeid"
              exit 1
            fi
          fi

      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_target == 'develop-eeid' && 'develop-eeid' || format('refs/pull/{0}/merge', inputs.pr_number) }}

      - name: Configure AWS Credentials (for ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and tag Docker image
        id: docker_build
        run: |
          if [[ "${{ inputs.deploy_target }}" == "develop-eeid" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="pr-${{ inputs.pr_number }}"
          fi

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_OUTPUT"

          docker build --no-cache --platform linux/amd64 -f .docker/Dockerfile-staging \
            -t ${{ env.APP_NAME }}:${TAG} .

      - name: ECR Login using AWS CLI
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_URL }}

      - name: Push Docker image to ECR
        run: |
          TAG=${{ steps.docker_build.outputs.IMAGE_TAG }}
          ECR_IMAGE="${{ env.ECR_URL }}/${{ env.APP_NAME }}:${TAG}"
          docker tag ${{ env.APP_NAME }}:${TAG} ${ECR_IMAGE}
          docker push ${ECR_IMAGE}

      - name: Mint GitHub App installation token (for IaC repo)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: internetee
          repositories: Ry_AWS_IaC

      - name: Trigger IaC deploy (repository_dispatch)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: internetee/Ry_AWS_IaC
          event-type: deploy-service-shared-staging
          client-payload: |
            {
              "app_name": "hydra",
              "image_tag": "${{ steps.docker_build.outputs.IMAGE_TAG }}",
              "pr_number": "${{ inputs.deploy_target == 'develop-eeid' && '0' || inputs.pr_number }}",
              "source_repo": "${{ github.repository }}",
              "shared_staging_db_mode": "off"
            }